services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: kamgo-agri-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kamgo_agri
      POSTGRES_USER: kamgo
      POSTGRES_PASSWORD: change_me_local_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: kamgo-agri-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
